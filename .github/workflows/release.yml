# Push a tag like v0.9.3.0 (matching meta.json + the .csproj) and this builds the plugin,
# creates the GitHub release with the zip, and adds it to manifest.json (the plugin repository).
#   git tag v0.9.3.0 && git push origin v0.9.3.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check versions match
        run: python3 .github/scripts/check_version.py "$VERSION"

      - name: Build
        run: dotnet build Jellyfin.Plugin.QuasiTV.csproj -c Release -o out

      - name: Package
        run: |
          mkdir pkg
          cp out/Jellyfin.Plugin.QuasiTV.dll meta.json logo.png pkg/
          (cd pkg && zip -j "../channel-free_${VERSION}.zip" *)

      - name: Create the release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json;m=json.load(open('meta.json'));print(m['changelog']+'\n\n**Install:** Jellyfin → Dashboard → Plugins → Repositories → add https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/manifest.json, then install Channel Free from the Catalog. Requires Jellyfin '+m['targetAbi'].rsplit('.',2)[0]+'+.')" > notes.md
          gh release create "$GITHUB_REF_NAME" "channel-free_${VERSION}.zip" --title "Channel Free ${VERSION}" --notes-file notes.md

      - name: Add version to manifest.json on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 .github/scripts/update_manifest.py "$VERSION" "channel-free_${VERSION}.zip" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/channel-free_${VERSION}.zip" \
            pkg/meta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Manifest: add ${VERSION}"
          git push origin main
